<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misión Emprende UDD — Creatividad</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo_transicioncreatividad.css">
  <link rel="stylesheet" href="fase3-serverless.css">
</head>
<body>
  <main class="team-container" role="region" aria-label="Introducción a creatividad">
    <section class="team-section">
      <div class="title-wrapper">
        <h1 class="title">Creatividad</h1>
      </div>

      <div class="mission-panel">
        <p>
          Agentes, la creatividad impulsa soluciones únicas.
          Ahora pondrán a prueba su idea construyendo con LEGO.
        </p>

        <div class="tablet-reminder">
          📱 Protocolo: recuerden rotar la tablet.
        </div>

        <div class="panel-divider"></div>

        <div class="next-step">
          <button
            id="btnListoCreatividad"
            class="f3-btn-ready"
            type="button"
          >
            ¡Estoy listo!
          </button>

          <div id="progresoCreatividad" class="f3-progress">
            0/0 grupos listos
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../compartido/js/api.js"></script>
  <script src="../compartido.js"></script>
  <script src="fase3-comun.js"></script>
  <script src="transicion-creatividad.js"></script>
</body>
</html>
