  <source src="../../compartido/recursos/sonidos/musica_habilidades.mp3" type="audio/mpeg">

<!-- Rutas de imágenes disponibles para mapa_agente.js -->

  const STATIC_IMAGES = {
    "trabajo en equipo": "../../compartido/recursos/imagenes/trabajoenEquipo.png",

    "negociacion":       "../../compartido/recursos/imagenes/negociacion.png",
  };
</script>

<script>
  window.MAPA_HABILIDADES_CONFIG = {
  habilidadActiva: "Misión final",
  habilidadesCompletadas: ["Trabajo en equipo", "Empatía", "Creatividad"],
  rutaContinuar: "#",
  textoBoton: "MISIÓN FINAL · PRÓXIMA FASE"
};
</script>

<script src="mapa-agente.js"></script>

<script>
const videosHabilidades = {
  "trabajo en equipo": "../../compartido/recursos/videos/TeamWork.mp4",
  "empatia":           "../../compartido/recursos/videos/Empatia.mp4",
  "creatividad":       "../../compartido/recursos/videos/Creatividad.mp4",
  "comunicacion":      "../../compartido/recursos/videos/Comunicacion.mp4",
  "negociacion":       "../../compartido/recursos/videos/Negociacion.mp4",
  "mision final": [
    "../../compartido/recursos/videos/Comunicacion.mp4",
    "../../compartido/recursos/videos/Negociacion.mp4"
  ]
};

  function normalizarTexto(texto) {
    return texto
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }
function mostrarAnimacionHabilidad(nombre) {
  const overlay = document.getElementById("habilidadOverlay");
  const titulo  = document.getElementById("habilidadTitulo");
  const video   = document.getElementById("habilidadVideo");

  const clave = normalizarTexto(nombre);
  const src = videosHabilidades[clave];

  if (!src) return;

  overlay.classList.add("show");

  const music = document.getElementById("bg-music");
  if (music) music.pause();

  video.pause();
  video.currentTime = 0;
  video.volume = 1.0;

  // Caso especial: MISIÓN FINAL reproduce Comunicación y luego Negociación
  if (Array.isArray(src)) {
    let indiceVideo = 0;

    function reproducirSiguienteVideo() {
      if (indiceVideo >= src.length) {
        cerrarAnimacionHabilidad();
        return;
      }

      if (indiceVideo === 0) {
        titulo.textContent = "COMUNICACIÓN";
      } else {
        titulo.textContent = "NEGOCIACIÓN";
      }

      video.pause();
      video.currentTime = 0;
      video.src = src[indiceVideo];

      indiceVideo++;

      video.play().catch(() => {
        setTimeout(reproducirSiguienteVideo, 1800);
      });
    }

    video.onended = reproducirSiguienteVideo;
    reproducirSiguienteVideo();
    return;
  }

  titulo.textContent = nombre.toUpperCase();
  video.src = src;

  video.play().catch(() => {
    setTimeout(cerrarAnimacionHabilidad, 2600);
  });

  video.onended = cerrarAnimacionHabilidad;
}

  function cerrarAnimacionHabilidad() {
    const overlay = document.getElementById("habilidadOverlay");
    const video   = document.getElementById("habilidadVideo");
    overlay.classList.remove("show");
    video.pause();
    video.currentTime = 0;

    // Reanudar música de fondo
    const music = document.getElementById("bg-music");
    if (music) music.play().catch(() => {});
  }

  document.addEventListener("click", function(event) {
    const nodo = event.target.closest(".nd");
    if (!nodo || nodo.classList.contains("locked")) return;

    const label = nodo.querySelector(".nd-lbl");
    if (!label) return;

    setTimeout(() => {
      mostrarAnimacionHabilidad(label.textContent);
    }, 120);
  });
</script>

  <script src="../../compartido/js/api.js"></script>
  <script src="../compartido.js"></script>
  <script src="../fase3/fase3-comun.js"></script>
  <script src="mapa-final.js"></script>
</body>
</html>
