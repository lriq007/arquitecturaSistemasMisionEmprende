<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misión Emprende UDD — Desafíos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo_transiciondesafio.css">
  <link rel="stylesheet" href="fase2-serverless.css">
</head>
<body>
  <main class="team-container" role="region" aria-label="Introducción a desafíos">
    <section class="team-section">
      <div class="title-wrapper"><h1 class="title">Desafíos</h1></div>
      <div class="mission-panel">
        <p>Agentes, toda misión inicia con un desafío.<br>Ahora elegirán su siguiente objetivo.</p>
        <div class="tablet-reminder">Protocolo: recuerden rotar la tablet.</div>
        <div class="panel-divider"></div>
        <div class="next-step serverless-f2-ready">
          <button id="btnListo" class="serverless-f2-button" type="button">¡ESTOY LISTO!</button>
          <div id="progreso" class="serverless-f2-progress">0/0 grupos listos</div>
        </div>
      </div>
    </section>
  </main>
  <script src="../../compartido/js/api.js"></script>
  <script src="../compartido.js"></script>
  <script src="fase2-comun.js"></script>
  <script src="transicion-desafio.js"></script>
</body>
</html>
